[project]
name = "ptp-translates-papers"
version = "0.1.0"
description = "PTP Translates Papers: a local PDF paper translation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = [
    "pypdfium2>=5.13",
    "PyYAML>=6.0",
    "huggingface_hub>=0.30",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
mineru = ["mineru>=4.1,<5"]

[project.scripts]
ptp = "ptp.cli:main"
ptp-install-mineru = "ptp.install_mineru:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptp"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "ptp/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
exclude = ["inputs/", "outputs/", "models/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
