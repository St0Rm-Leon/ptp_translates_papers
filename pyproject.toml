[project]
name = "ptp-translates-papers"
version = "0.1.0"
description = "PTP Translates Papers: a local PDF paper translation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mineru>=4.1,<5",
    "pypdfium2>=5.13",
    "PyYAML>=6.0",
    "huggingface_hub>=0.30",
    "beautifulsoup4>=4.12",
]

[project.scripts]
ptp = "ptp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
